<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141715"><title>Distrito 17 — Tu próxima cita</title><meta name="description" content="Demo de agenda de barbería con aprobación, horarios y recordatorios simulados."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23141715'/%3E%3Ctext x='6' y='28' fill='%23d7b875' font-size='24'%3E17%3C/text%3E%3C/svg%3E"><style>:root{--bg:#f3f4f0;--ink:#1b2420;--muted:#626d65;--green:#183f32;--gold:#d7b875;--line:#d9dfd8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 16px;min-height:44px}button:hover{border-color:var(--green);background:#eef3ee}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b0832e;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 5%;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:2px}.brand>b{background:var(--ink);color:white;font-size:23px;padding:10px;border-radius:9px;letter-spacing:-2px}.brand>b span{color:var(--gold)}small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}.brand small{font-size:11px;letter-spacing:2px;margin-top:3px}nav{display:flex;gap:4px}nav button{border:0;background:transparent;font-size:14px}nav .active{background:var(--green);color:#fff}.demo-tag{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}.demo-bar{padding:13px 5%;background:#e8ede6;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:14px}.demo-bar strong{margin-right:12px}.clock-actions{display:flex;gap:6px;flex-wrap:wrap}.clock-actions button{font-size:13px;padding:6px 11px}.text-button{background:transparent;border-color:transparent}main{max-width:1280px;margin:auto;padding:40px 32px 70px}.eyebrow{color:var(--green);font-weight:750;font-size:12px;letter-spacing:2px;margin:0 0 12px}h1{font:500 clamp(32px,4vw,48px)/1.1 Georgia,serif;margin:0 0 15px;letter-spacing:-1px}h2{font:500 27px/1.2 Georgia,serif;margin:0 0 16px}h3{font-size:17px;margin:0 0 6px}p{margin:0 0 18px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:20px}.muted{color:var(--muted)}.location{font-size:14px;text-align:right}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:22px}.step{display:flex;gap:12px;align-items:center;margin-bottom:20px}.step span{border:1px solid var(--line);border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-size:13px;color:var(--muted)}.step h2{font-family:inherit;font-size:18px;margin:0;font-weight:650}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{text-align:left;padding:16px;position:relative}.service b{display:block;margin-bottom:5px;font-size:15px}.service small{font-size:14px}.service strong{display:block;margin-top:15px;font-size:18px}.selected{border:2px solid var(--green)!important;background:#f0f5f0!important}.filters{display:flex;gap:14px;margin-bottom:24px}.filters label{flex:1}label{display:block;font-size:14px;font-weight:600;margin-bottom:16px}select,input{display:block;width:100%;padding:11px;border-radius:7px;border:1px solid #bcc8be;background:#fff;color:var(--ink);margin-top:6px;min-height:46px}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.time{font-weight:650;font-size:15px}.legend{font-size:13px;margin:15px 0 0;color:var(--muted)}.dark{background:var(--green);color:white;border-color:var(--green)}.dark .eyebrow{color:var(--gold)}.dark p,.dark small{color:#d2dfd6}.rules{list-style:none;margin:25px 0 0;padding:0}.rules li{display:flex;gap:16px;padding:16px 0;border-top:1px solid #ffffff28}.rules strong{font-size:22px;color:var(--gold);min-width:72px}.rules span{font-size:14px}.request{padding:18px 0;border-top:1px solid var(--line)}.request:first-of-type{border-top:0}.request h3{margin-bottom:10px}.pill{display:inline-block;border-radius:5px;padding:4px 8px;font-size:12px;font-weight:700;background:#e8ede8;color:#405145}.pill.pending{background:#fff0d5;color:#85520c}.pill.confirmed{background:#deeee2;color:#235338}.pill.expired,.pill.rejected,.pill.cancelled{background:#f3e7e3;color:#8a4b37}.request p{font-size:14px;margin:8px 0}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:650}.primary:hover{background:#24543f;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:14px}.empty{padding:24px 0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);padding:18px 22px;border-radius:12px}.stat b{display:block;font-size:30px;font-weight:550}.stat span{font-size:14px;color:var(--muted)}.workweek{display:grid;gap:9px}.day-row{display:grid;grid-template-columns:75px 1fr 1fr;gap:10px;align-items:center}.day-row label{display:flex;align-items:center;gap:5px;margin:0}.day-row input[type=checkbox]{width:18px;min-height:18px;margin:0}.day-row input{font-size:14px;margin:0;padding:6px;min-width:0}.notice{padding:14px;background:#edf2ed;border-radius:8px;font-size:14px;margin:15px 0}.event{font-size:14px;padding:12px 0;border-bottom:1px solid var(--line)}.event small{margin-top:5px}.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.plan-grid ul{padding-left:20px}.plan-grid li{margin:12px 0}dialog{border:0;border-radius:18px;padding:32px;max-width:470px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#102319a8;backdrop-filter:blur(4px)}dialog .close{float:right;border:0;font-size:25px;padding:0 10px}dialog .primary{width:100%}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90%;padding:14px 23px;background:var(--ink);color:#fff;border-radius:10px;box-shadow:0 10px 40px #0002;display:none;z-index:10}#toast.visible{display:block}.schedule-note{font-size:13px;color:var(--muted)}@media(max-width:950px){header{flex-wrap:wrap}.demo-tag{display:none}.layout{grid-template-columns:1fr}.layout aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}.demo-bar{align-items:flex-start}.plan-grid{grid-template-columns:1fr}.location{display:none}}@media(max-width:600px){header{padding:16px 20px;gap:15px}nav{width:100%;overflow:auto}nav button{flex:1;font-size:13px;padding:9px 6px;white-space:nowrap}.demo-bar{display:block;padding:13px 20px}.clock-actions{margin-top:10px}main{padding:28px 18px}.panel{padding:20px}.services{grid-template-columns:1fr}.service{display:grid;grid-template-columns:1fr auto}.service strong{margin:0;grid-column:2;grid-row:1/3}.service b{font-size:16px}.filters{display:block}.times{grid-template-columns:repeat(3,1fr)}.layout aside{display:block}.stats{gap:8px}.stat{padding:14px 10px}.stat span{font-size:12px}.stat b{font-size:26px}.intro{margin-bottom:24px}h1{font-size:35px}.day-row{grid-template-columns:64px 1fr 1fr}.brand small{font-size:10px}}
</style></head><body>
<header><a class="brand" href="#"><b>D<span>17</span></b><div>DISTRITO 17<small>BARBERÍA · CHIHUAHUA</small></div></a><nav aria-label="Vistas de demostración"><button data-view="client" class="active">Reservar cita</button><button data-view="barber">Panel del barbero <span id="badge"></span></button><button data-view="plan">Mantenimiento</button></nav><span class="demo-tag">DEMO INTERACTIVA</span></header>
<div class="demo-bar"><div><strong>Reloj de prueba</strong> <span id="clock"></span><small>Datos ficticios · Solo en este navegador · No envía mensajes reales</small></div><div class="clock-actions"><button id="advance">+ 30 minutos</button><button id="hour">+ 1 hora</button><button id="reset" class="text-button">Reiniciar demo</button></div></div>
<main id="main"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="bookingDialog"><form id="bookingForm"><button type="button" class="close" aria-label="Cerrar">×</button><p class="eyebrow">TU PRÓXIMO CORTE</p><h2>Solicitar este horario</h2><p id="bookingSummary"></p><label>Nombre para la cita<input id="customer" required maxlength="60" autocomplete="name" placeholder="Ej. Carlos Leyva"></label><label>Teléfono de ejemplo<input id="phone" required inputmode="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10 dígitos; usa datos ficticios"></label><div class="notice">Tu solicitud aparta el espacio durante 30 minutos. La cita solo queda confirmada cuando el barbero la acepta.</div><button class="primary" type="submit">Enviar solicitud →</button></form></dialog>
<script>const Agenda={
 services:[{id:'corte',name:'Corte clásico',duration:30,price:180},{id:'combo',name:'Corte + barba',duration:45,price:260},{id:'barba',name:'Diseño de barba',duration:30,price:120}],
 initial(){const date=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chihuahua',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return {now:new Date(date+'T09:00:00-06:00').getTime(),appointments:[],events:[],week:Array.from({length:7},(_,i)=>({open:i!==0,start:'10:00',end:'19:00'}))};},
 iso(t){return new Date(t-6*3600000).toISOString().slice(0,10);},
 minutes(t){const d=new Date(t-6*3600000);return d.getUTCHours()*60+d.getUTCMinutes();},
 time(s){const [h,m]=s.split(':').map(Number);return h*60+m;},
 expire(s){for(const a of s.appointments){if(a.status==='pending'&&s.now>=a.created+1800000){a.status='expired';s.events.unshift({at:s.now,text:`La solicitud de ${a.name} venció sin aprobación. El espacio se liberó.`});}if(a.status==='confirmed'&&!a.reminded&&s.now>=a.start-3600000){a.reminded=true;s.events.unshift({at:s.now,text:`Recordatorio simulado para ${a.name}: cita ${this.format(a.start)}. Llegada ${this.format(a.start-600000)}.`});}}},
 format(t){return new Intl.DateTimeFormat('es-MX',{timeZone:'America/Chihuahua',hour:'2-digit',minute:'2-digit',hour12:true}).format(t);},
 available(s,start,barber,service){this.expire(s);const svc=this.services.find(x=>x.id===service);if(!svc||!['Mateo','Diego'].includes(barber)||!Number.isFinite(start)||start<s.now+7200000)return false;const d=new Date(start-6*3600000),w=s.week[d.getUTCDay()],m=this.minutes(start),end=m+svc.duration;if(!w.open||m<this.time(w.start)||end>this.time(w.end)||m%15!==0||(m<900&&end>840))return false;return !s.appointments.some(a=>a.barber===barber&&['pending','confirmed'].includes(a.status)&&start<a.start+a.duration*60000&&start+svc.duration*60000>a.start);},
 create(s,input){const {start,barber,service,name,phone}=input;if(typeof name!=='string'||!name.trim()||name.trim().length>60||!/^\d{10}$/.test(phone))throw Error('Revisa el nombre y los 10 dígitos del teléfono.');if(!this.available(s,start,barber,service))throw Error('Ese horario ya no está disponible o tiene menos de 2 horas de anticipación.');const svc=this.services.find(x=>x.id===service);const a={id:'D17-'+Math.random().toString(36).slice(2,8).toUpperCase(),start,barber,service,name:name.trim(),phone,duration:svc.duration,price:svc.price,created:s.now,status:'pending',reminded:false};s.appointments.push(a);s.events.unshift({at:s.now,text:`Nueva solicitud de ${a.name}. Hay 30 minutos para responder.`});return a;},
 act(s,id,action){this.expire(s);const a=s.appointments.find(a=>a.id===id);if(!a)throw Error('Solicitud no encontrada.');if(action==='cancel'){if(!['pending','confirmed'].includes(a.status)||a.start<=s.now)throw Error('Esta cita ya no puede cancelarse.');a.status='cancelled';}else{if(!['accept','reject'].includes(action)||a.status!=='pending')throw Error('La solicitud ya no está pendiente.');a.status=action==='accept'?'confirmed':'rejected';}s.events.unshift({at:s.now,text:`${a.name}: ${a.status==='confirmed'?'cita confirmada':a.status==='rejected'?'solicitud rechazada':'cita cancelada'}.`});this.expire(s);return a;}
};
if(typeof module!=='undefined')module.exports=Agenda;
</script><script>'use strict';
const $=s=>document.querySelector(s),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(sessionStorage.getItem('d17-demo-v1'));if(!state?.week||!Array.isArray(state.appointments))state=null;}catch{}state ||= Agenda.initial();
let view='client',service='corte',barber='Mateo',date=Agenda.iso(state.now),selected=null;
const statusNames={pending:'Por aprobar',confirmed:'Confirmada',expired:'Vencida',rejected:'Rechazada',cancelled:'Cancelada'};
function persist(){try{sessionStorage.setItem('d17-demo-v1',JSON.stringify(state));}catch{}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('visible');setTimeout(()=>$('#toast').classList.remove('visible'),5000);}
function fullDate(t){return new Intl.DateTimeFormat('es-MX',{timeZone:'America/Chihuahua',weekday:'long',day:'numeric',month:'long'}).format(t);}
function notifyError(fn){try{fn();persist();render();}catch(e){toast(e.message);}}
function card(a,admin=false){const svc=Agenda.services.find(s=>s.id===a.service),remaining=Math.max(0,Math.ceil((a.created+1800000-state.now)/60000));return `<article class="request"><h3>${Agenda.format(a.start)} <span class="pill ${a.status}">${statusNames[a.status]}</span></h3><b>${escapeHTML(a.name)}</b><p>${svc.name} · ${a.barber} · $${a.price} MXN<br>${fullDate(a.start)}</p><small>Folio ${a.id}</small>${a.status==='pending'?`<p>El barbero tiene <strong>${remaining} min</strong> para responder. Aún no es una cita confirmada.</p>`:''}${a.status==='confirmed'?`<p><strong>Llega a las ${Agenda.format(a.start-600000)}.</strong><br>Recordatorio: ${Agenda.format(a.start-3600000)}${a.reminded?' · Simulado ✓':''}</p>`:''}<div class="actions">${admin&&a.status==='pending'?`<button class="primary" data-act="accept" data-id="${a.id}">Aceptar</button><button data-act="reject" data-id="${a.id}">Rechazar</button>`:''}${['pending','confirmed'].includes(a.status)&&a.start>state.now?`<button data-act="cancel" data-id="${a.id}">Cancelar ${a.status==='pending'?'solicitud':'cita'}</button>`:''}</div></article>`;}
function slots(){const options=[];for(let m=600;m<1140;m+=15){const t=new Date(date+`T${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:00-06:00`).getTime();if(Agenda.available(state,t,barber,service))options.push(`<button class="time" data-slot="${t}">${Agenda.format(t)}</button>`);}return options.length?options.join(''):'<p class="empty">No hay espacios disponibles. Prueba otra fecha o barbero.</p>';}
function client(){return `<div class="intro"><div><p class="eyebrow">TU TIEMPO, BIEN AGENDADO</p><h1>Un buen corte empieza<br>con un buen horario.</h1><p class="muted">Elige tu espacio. Tu barbero confirma en un máximo de 30 minutos.</p></div><div class="location"><b>Distrito 17 · Sucursal Centro</b><br>Chihuahua, Chihuahua<br><small>Establecimiento ficticio · Precios de ejemplo</small></div></div><div class="layout"><section><div class="panel"><div class="step"><span>1</span><h2>Elige tu servicio</h2></div><div class="services">${Agenda.services.map(s=>`<button class="service ${s.id===service?'selected':''}" aria-pressed="${s.id===service}" data-service="${s.id}"><b>${s.name}</b><small>${s.duration} minutos</small><strong>$${s.price}</strong></button>`).join('')}</div></div><div class="panel"><div class="step"><span>2</span><h2>Encuentra tu horario</h2></div><div class="filters"><label>Tu barbero<select id="barber"><option ${barber==='Mateo'?'selected':''}>Mateo</option><option ${barber==='Diego'?'selected':''}>Diego</option></select></label><label>Día de la cita<input type="date" id="date" value="${date}" min="${Agenda.iso(state.now)}"></label></div><div class="times">${slots()}</div><p class="legend">Horarios de Chihuahua · Comida de 2:00 a 3:00 p. m.<br>Solo se muestran espacios con al menos 2 horas de anticipación.</p></div><div class="panel"><div class="step"><span>3</span><h2>Consulta tus solicitudes de prueba</h2></div>${state.appointments.length?state.appointments.slice().reverse().map(a=>card(a)).join(''):'<div class="empty">Todavía no has solicitado una cita. Elige un horario para comenzar.</div>'}</div></section><aside><div class="panel dark"><p class="eyebrow">ANTES DE RESERVAR</p><h2>Tu cita, sin confusiones.</h2><ul class="rules"><li><strong>2 h</strong><span>Anticipación mínima para solicitar tu horario.</span></li><li><strong>30 min</strong><span>Para que el barbero acepte. Si no responde, la solicitud vence.</span></li><li><strong>10 min</strong><span>Llega antes del inicio de tu servicio.</span></li><li><strong>1 h</strong><span>Antes de tu cita, te recordamos la hora de llegada.</span></li></ul></div><div class="panel"><h3>Prueba el recorrido completo</h3><p class="muted">Solicita una cita, abre el panel del barbero y acéptala. Usa el reloj de prueba para ver el recordatorio o dejar vencer una solicitud.</p><small>El reloj solo avanza con los botones. La demo guarda datos en esta pestaña; no comparte reservas entre dispositivos.</small></div></aside></div>`;}
function admin(){const pending=state.appointments.filter(a=>a.status==='pending'),confirmed=state.appointments.filter(a=>a.status==='confirmed');return `<div class="intro"><div><p class="eyebrow">DISTRITO 17 / GESTIÓN</p><h1>Todo listo para tu día.</h1><p class="muted">Aprueba solicitudes y organiza tu semana.</p></div><span class="pill">Panel de demostración · Sin acceso real de empleados</span></div><div class="stats"><div class="stat"><b>${pending.length}</b><span>Por aprobar</span></div><div class="stat"><b>${confirmed.length}</b><span>Confirmadas</span></div><div class="stat"><b>${state.appointments.filter(a=>a.status==='expired').length}</b><span>Solicitudes vencidas</span></div></div><div class="layout"><section><div class="panel"><h2>Solicitudes por aprobar</h2>${pending.length?pending.map(a=>card(a,true)).join(''):'<p class="empty">Estás al día. Las solicitudes de la vista cliente aparecerán aquí.</p>'}</div><div class="panel"><h2>Agenda confirmada</h2>${confirmed.length?confirmed.sort((a,b)=>a.start-b.start).map(a=>card(a,true)).join(''):'<p class="empty">Aún no hay citas confirmadas.</p>'}</div><div class="panel"><h2>Avisos simulados</h2><p class="muted">Así se verían las confirmaciones, vencimientos y recordatorios. No se envían SMS ni WhatsApp.</p>${state.events.length?state.events.slice(0,12).map(e=>`<div class="event">${escapeHTML(e.text)}<small>${fullDate(e.at)} · ${Agenda.format(e.at)}</small></div>`).join(''):'<p class="empty">Los avisos aparecerán al interactuar con la agenda.</p>'}</div></section><aside><div class="panel"><p class="eyebrow">HORARIO REPETIBLE</p><h2>Tu semana</h2><p class="schedule-note">Este horario se aplica a ambos barberos. Descanso diario: 14:00–15:00.</p><form id="schedule"><div class="workweek">${state.week.map((d,i)=>`<div class="day-row"><label><input type="checkbox" name="open${i}" ${d.open?'checked':''}>${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][i]}</label><input aria-label="Inicio ${i}" type="time" name="start${i}" value="${d.start}" step="900" required><input aria-label="Fin ${i}" type="time" name="end${i}" value="${d.end}" step="900" required></div>`).join('')}</div><button class="primary" style="width:100%;margin-top:20px">Guardar horario</button><small style="margin-top:12px">Si un cambio afecta una cita o solicitud activa, primero tendrás que resolverla.</small></form></div><div class="panel dark"><h3>El espacio queda protegido</h3><p>Una solicitud bloquea toda la duración del servicio. Cada barbero tiene su propia disponibilidad.</p></div></aside></div>`;}
function plan(){return `<div class="intro"><div><p class="eyebrow">DE LA MUESTRA AL SERVICIO</p><h1>Una base. Cada barbería,<br>a su manera.</h1><p class="muted">Plan de operación propuesto para convertir esta demo en un servicio real.</p></div></div><div class="plan-grid"><section class="panel"><h2>01 · Qué muestra esta demo</h2><ul><li>Reservas con 2 horas mínimas de anticipación.</li><li>Aprobación en 30 minutos y vencimiento automático al avanzar el reloj.</li><li>Horarios por duración y barbero, sin empalmes dentro de esta sesión.</li><li>Llegada 10 minutos antes y recordatorio simulado 1 hora antes.</li><li>Horario semanal editable y cancelaciones.</li></ul><div class="notice">Solo datos ficticios en esta pestaña. Sin pagos, mensajes externos, cuentas de usuario ni sincronización entre dispositivos.</div></section><section class="panel"><h2>02 · Antes de usarla con clientes</h2><ul><li>Base de datos compartida y reservas protegidas ante solicitudes simultáneas.</li><li>Acceso seguro para dueños y empleados; datos separados por barbería.</li><li>Reloj del servidor en Chihuahua y tareas automáticas de vencimiento y avisos.</li><li>Canal de mensajes contratado, consentimiento del cliente y seguimiento de entrega.</li><li>Respaldo y restauración probados, límites contra spam y aviso de privacidad.</li></ul></section><section class="panel"><h2>03 · Mantenimiento incluido</h2><ul><li><b>Continuo:</b> vigilar disponibilidad, errores y avisos que no se entregan.</li><li><b>Diario:</b> respaldar datos y revisar tareas fallidas.</li><li><b>Semanal:</b> resolver incidencias y revisar solicitudes vencidas.</li><li><b>Mensual:</b> actualizar dependencias, probar el flujo y revisar costos.</li><li><b>Trimestral:</b> comprobar restauración de respaldos y accesos de empleados.</li></ul></section><section class="panel dark"><p class="eyebrow">MODELO PROPUESTO</p><h2>Instalación + mensualidad</h2><p>La instalación cubre nombre, servicios, personal, horarios y capacitación.</p><p>La mensualidad cubre alojamiento, respaldo, soporte y mantenimiento. La mensajería lleva un límite claro o se cobra según consumo.</p><p>Funciones especiales se cotizan por separado. El precio final se define después del piloto y de medir costos reales.</p><small>Piloto sugerido: 1 barbería durante 2 semanas. Medir reservas completadas, tiempo de aprobación, errores y gasto de mensajes.</small></section></div>`;}
function render(){Agenda.expire(state);persist();$('#clock').textContent=fullDate(state.now)+' · '+Agenda.format(state.now);$('#badge').textContent=state.appointments.filter(a=>a.status==='pending').length||'';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#main').innerHTML=view==='client'?client():view==='barber'?admin():plan();}
function advance(m){state.now+=m*60000;Agenda.expire(state);if(date<Agenda.iso(state.now))date=Agenda.iso(state.now);persist();render();toast('Reloj de prueba avanzado '+m+' minutos.');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();}if(b.dataset.service){service=b.dataset.service;render();}if(b.dataset.slot){selected=Number(b.dataset.slot);const svc=Agenda.services.find(s=>s.id===service);$('#bookingSummary').textContent=`${svc.name} con ${barber} · ${fullDate(selected)} · ${Agenda.format(selected)} · $${svc.price} MXN`;$('#bookingDialog').showModal();}if(b.classList.contains('close'))$('#bookingDialog').close();if(b.dataset.act)notifyError(()=>{Agenda.act(state,b.dataset.id,b.dataset.act);toast('Estado actualizado. Consulta los avisos en el panel.');});});
document.addEventListener('change',e=>{if(e.target.id==='barber'){barber=e.target.value;render();}if(e.target.id==='date'&&e.target.value){date=e.target.value;render();}});
$('#bookingForm').addEventListener('submit',e=>{e.preventDefault();notifyError(()=>{const a=Agenda.create(state,{start:selected,barber,service,name:$('#customer').value,phone:$('#phone').value});$('#bookingDialog').close();$('#bookingForm').reset();toast('Solicitud '+a.id+' enviada. Ahora puedes aprobarla en el panel del barbero.');});});
document.addEventListener('submit',e=>{if(e.target.id!=='schedule')return;e.preventDefault();notifyError(()=>{const f=new FormData(e.target),week=state.week.map((d,i)=>({open:f.has('open'+i),start:f.get('start'+i),end:f.get('end'+i)}));for(const d of week)if(d.open&&(d.start>=d.end||Agenda.time(d.start)<600||Agenda.time(d.end)>1140||Agenda.time(d.start)%15||Agenda.time(d.end)%15))throw Error('Usa horarios entre 10:00 y 19:00, en intervalos de 15 minutos, con inicio anterior al cierre.');for(const a of state.appointments.filter(a=>['pending','confirmed'].includes(a.status)&&a.start>state.now)){const d=week[new Date(a.start-21600000).getUTCDay()],m=Agenda.minutes(a.start);if(!d.open||m<Agenda.time(d.start)||m+a.duration>Agenda.time(d.end))throw Error('El cambio afecta una cita activa. Resuélvela antes de cambiar ese horario.');}state.week=week;toast('Horario semanal guardado.');});});
$('#advance').onclick=()=>advance(30);$('#hour').onclick=()=>advance(60);$('#reset').onclick=()=>{if(!confirm('¿Borrar las solicitudes de prueba y reiniciar el reloj?'))return;state=Agenda.initial();date=Agenda.iso(state.now);render();toast('Demo reiniciada.');};
render();
if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'read_demo_agenda',description:'Lee las solicitudes ficticias y el reloj de esta demostración local.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>({now:state.now,appointments:state.appointments.map(({id,start,status,barber,service})=>({id,start,status,barber,service}))})});}
</script></body></html>
